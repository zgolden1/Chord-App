# Render Blueprint: New > Blueprint > pick this repo. Free plan sleeps when idle (first request is slow).
services:
  - type: web
    name: chordflow-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL        # Supabase connection string (free PostgreSQL). Do not use SQLite here: the disk is wiped on restart.
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: WORKER_TOKEN
        generateValue: true
      - key: YOUTUBE_API_KEY
        sync: false
      - key: MB_CONTACT
        sync: false
      - key: CORS_ORIGINS
        value: "*"
